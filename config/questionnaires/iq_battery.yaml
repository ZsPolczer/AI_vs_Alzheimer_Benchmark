# =============================================================================
# EATEOT IQ BATTERY — versioned questionnaire
# =============================================================================
# This is the default COMBINED battery: logical reasoning + spatial reasoning
# in one run (the "run both simultaneously" option). The two halves are also
# saved separately as `logic_battery.yaml` and `spatial_battery.yaml` — select
# them with `--questionnaire logic_battery` / `--questionnaire spatial_battery`.
# Edit questions, anchors, or max points here without touching Python code.
# Add new questionnaires as separate YAML files in this directory and select
# them at startup with `--questionnaire <name>` (or EATEOT_QUESTIONNAIRE_DIR
# for a custom folder).
#
# Schema per question:
#   tier:                 int (1..N, ascending difficulty)
#   domain:               str
#   target_iq:            str (human-readable target band)
#   question:             str (the prompt shown to the model)
#   ground_truth_anchors: list[list[str]]  — each inner list is a group of
#                           acceptable synonyms; a group matches if ANY of its
#                           synonyms appears in the model output.
#   max_points:           int (points awarded for a full logical match)

name: iq_battery
version: 4
description: Combined EATEOT IQ battery — logical reasoning + spatial reasoning (incl. the hard spatial tiers 6–7); run each half alone via logic_battery / spatial_battery

questions:
  - tier: 1
    domain: Categorical Reasoning
    target_iq: "75 - Property / Category Classification"
    question: "Which item does NOT belong in this list based on physical material properties, and why? [Gold, Silver, Copper, Wood]"
    ground_truth_anchors:
      - [wood]
      - [metal, metals, metallic, conductor]
    max_points: 15

  - tier: 2
    domain: Numerical Sequence
    target_iq: "90 - Non-Standard Pattern Sequence"
    question: "What is the next number in this sequence and what is the exact mathematical rule? Sequence: 2, 5, 11, 23, 47, __"
    ground_truth_anchors:
      - ["95"]
      - [multiply, double, times 2, "* 2", x 2]
    max_points: 20

  - tier: 3
    domain: Counterfactual Deductive
    target_iq: "105 - Counterfactual Syllogism"
    question: "Premise 1: All rocks can fly. Premise 2: A ruby is a rock. Question: Based STRICTLY on these premises, can a ruby fly? State Yes or No and quote or explain why based on Premise 1."
    ground_truth_anchors:
      - ["yes"]
      - [all rocks, premise 1, rocks can fly, classified as a rock]
    max_points: 20

  - tier: 4
    domain: Relational Memory
    target_iq: "120 - Multi-Variable Relational Ordering"
    question: "Box A is heavier than Box B. Box C is lighter than Box B. Box D is heavier than Box A. State: 1) The heaviest box, and 2) The lightest box."
    ground_truth_anchors:
      - ["heaviest: d", "heaviest is d", box d]
      - ["lightest: c", "lightest is c", box c]
    max_points: 22

  - tier: 5
    domain: Spatial Reasoning
    target_iq: "110 - 2D Left-Right Transitive Ordering"
    question: "Three colored objects sit in a row: [GREEN] [RED] [BLUE]. Which object is the leftmost? Answer with the object color."
    # Deliberately ONE unambiguous answer per question: the anchor color
    # appears only inside the diagram brackets, never in the question
    # sentence, so echoing the prompt collects no credit and a wrong color
    # cannot accidentally match. (Two-answer formats are reversal-blind for
    # any matcher — 'green, blue' vs 'blue, green' both contain both words.)
    ground_truth_anchors:
      - ["green"]
    max_points: 10

  - tier: 5
    domain: Spatial Reasoning
    target_iq: "110 - 2D Compass Layout"
    question: "Four objects sit on a compass grid. The SQUARE is north of the TRIANGLE. The CIRCLE is north of the SQUARE. The STAR is west of the TRIANGLE. Which object is the northernmost? Answer with the object name."
    # Same rule as above: the correct name appears nowhere in the question
    # sentence, so the model must compose the layout from the two relations.
    # (CIRCLE is north of SQUARE which is north of TRIANGLE, so CIRCLE is the
    # unique northernmost — with CIRCLE east of SQUARE it would tie with
    # SQUARE and the question would be ambiguous.)
    ground_truth_anchors:
      - ["circle", "○"]
    max_points: 10

  - tier: 5
    domain: Spatial Reasoning
    target_iq: "110 - Recurring Symbol Pattern (Raven-style)"
    question: "A row of symbols follows a repeating pattern: [Δ] [□] [○] [Δ] [□] [?]. Which symbol comes next? Answer with the shape name."
    # The pattern repeats every three symbols (Δ □ ○), so the 6th is ○. The
    # answer name appears nowhere in the question sentence — only the glyphs
    # sit inside the diagram brackets — so the model must read the recurrence.
    ground_truth_anchors:
      - ["circle", "○"]
    max_points: 10

  - tier: 5
    domain: Spatial Reasoning
    target_iq: "115 - 3x3 Symbol Matrix (Raven-style)"
    question: "A 3x3 grid: row 1: [Δ] [□] [○] / row 2: [□] [○] [Δ] / row 3: [○] [Δ] [?]. Each row and each column must contain each symbol exactly once. Which symbol belongs in the missing cell? Answer with the shape name."
    # Latin-square rule: the missing cell must be □ (column 3 already has ○ and
    # Δ; row 3 already has ○ and Δ). Square is never named in the sentence.
    ground_truth_anchors:
      - ["square", "□"]
    max_points: 10

  - tier: 6
    domain: Abstract Set Logic
    target_iq: "135 - Formal Set Logic"
    question: "Premise 1: All Xorks are Mipsters. Premise 2: No Mipsters are GORPs. Premise 3: Some GORPs are Snarks. Question: Can a Xork EVER be a GORP? Answer Yes or No and explain using Premise 1 or 2."
    ground_truth_anchors:
      - ["no"]
      - [mipster, mipsters, premise 2, exclusivity]
    max_points: 23

  # ---- Harder spatial items (added in version 4) ----------------------------
  # Same items as spatial_battery.yaml so the combined default run covers the
  # full spatial range. The answer values never appear in the question text.

  - tier: 6
    domain: Spatial Reasoning
    target_iq: "120 - Mirror Reflection (Time Reversal)"
    question: "A wall clock shows 3 o'clock. You look at its reflection in a mirror. What hour does the clock appear to show in the mirror? Give the hour as a number."
    ground_truth_anchors:
      - ["9", "nine"]
    max_points: 12

  - tier: 6
    domain: Spatial Reasoning
    target_iq: "120 - Mirror Symmetry (Letter Reflection)"
    question: "A lowercase letter 'b' is held up to a mirror. What lowercase letter does its reflection look like? Give the letter."
    ground_truth_anchors:
      - ["d"]
    max_points: 12

  - tier: 7
    domain: Spatial Reasoning
    target_iq: "130 - Spatial Vector Composition (Pythagorean)"
    question: "Town B lies 40 km due north of Town A. Town C lies 30 km due east of Town B. A straight road is built from Town A directly to Town C. How many kilometers long is this road? Give the number."
    ground_truth_anchors:
      - ["50", "fifty"]
    max_points: 14

  - tier: 7
    domain: Spatial Reasoning
    target_iq: "135 - 3D Edge Enumeration (4x4x4 Cube)"
    question: "A 4x4x4 cube made of unit cubes is dipped in paint so all six outer faces are covered, then taken apart into the 64 unit cubes. How many unit cubes have paint on exactly two faces? Give the number."
    ground_truth_anchors:
      - ["24", "twenty four", "twenty-four"]
    max_points: 15
